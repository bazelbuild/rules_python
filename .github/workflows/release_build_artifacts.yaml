# Builds `//dev/release_artifacts:artifacts_for_release` for the platforms in
# dev/platforms, which cover python-build-standalone's platforms except s390x;
# see dev/release_artifacts/build.sh. Linux x86_64 runners cross-compile the
# files for other Linux CPUs. macOS and Windows files need those OSes' SDKs, so
# they're built on those OSes.
name: "Release: Build Artifacts"

on:
  workflow_call:
    inputs:
      ref:
        description: "The git ref (e.g. release tag) to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "The git ref (e.g. release tag) to build. Defaults to the selected ref."
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # Builds take a few minutes; cancel hung ones instead of holding a runner
    # for the default 6 hours.
    timeout-minutes: 30
    strategy:
      # Report the result of every platform instead of stopping at the first
      # failure.
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            runner: macos-15
          - triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
          - triple: x86_64-pc-windows-msvc
            runner: windows-2022
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          # Cross-compiled; see dev/platforms/BUILD.bazel.
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - triple: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
          - triple: i686-pc-windows-msvc
            runner: windows-2022
          - triple: i686-unknown-linux-musl
            runner: ubuntu-24.04
          - triple: powerpc64le-unknown-linux-musl
            runner: ubuntu-24.04
          - triple: riscv64gc-unknown-linux-musl
            runner: ubuntu-24.04
    env:
      REF: ${{ inputs.ref || github.ref_name }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Windows images also have a fixed-version `bazel` on PATH. 1.20.0,
          # used by the other workflows, has no windows-arm64 build.
          bazelisk-version: 1.29.0

      # Release commands run main's workflows, even for patch releases of older
      # release branches. Skip refs without dev/platforms, since their scripts
      # don't build for the job's platform, or don't exist. If a ref's
      # dev/platforms lacks the job's platform, build.sh fails.
      - name: Build artifacts
        id: build
        if: hashFiles('dev/platforms/BUILD.bazel') != ''
        run: dev/release_artifacts/build.sh "$REF" "$TRIPLE"

      # build.sh only sets `files` if the build succeeded. If the build failed,
      # it only adds a warning, since releases don't use the files yet.
      - name: Verify artifacts
        if: steps.build.outputs.files != ''
        run: dev/release_artifacts/verify.sh "$TRIPLE"

      # Stores the files with this workflow run so the publish job (and users
      # viewing the run) can download them.
      - name: Upload artifacts
        if: steps.build.outputs.files != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.triple }}
          path: ${{ steps.build.outputs.files }}
          if-no-files-found: error

  publish:
    name: Publish artifacts
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true

      # The hashFiles(...) checks below are for backwards compatibility with
      # patch releases of older release branches that predate these scripts and
      # artifacts (and while artifact build failures are non-fatal). They can be
      # removed once older release branches are no longer supported.
      - name: Generate SHA256SUMS
        if: hashFiles('release-artifacts/*') != ''
        working-directory: release-artifacts
        run: sha256sum * > ../SHA256SUMS

      - name: Generate artifacts manifest
        if: >-
          hashFiles('dev/release_artifacts/generate_artifacts_manifest.py') != '' &&
          hashFiles('release-artifacts/*') != ''
        run: |
          dev/release_artifacts/generate_artifacts_manifest.py \
            "$REF" release-artifacts artifacts_manifest.json

      - name: Upload artifacts to GitHub release
        if: hashFiles('release-artifacts/*') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*
            SHA256SUMS

      - name: Upload artifacts manifest
        if: hashFiles('artifacts_manifest.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-manifest
          path: artifacts_manifest.json
          if-no-files-found: error
